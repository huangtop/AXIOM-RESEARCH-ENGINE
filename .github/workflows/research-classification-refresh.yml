name: Evidence and Research Classification Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Synchronize main before generating derived artifacts
        run: git pull --ff-only origin main
      - run: pip install -e .[dev]
      - name: Smoke-test workflow and publication contracts
        run: >-
          pytest -q
          tests/test_workflow_frequency_contracts.py
          tests/test_coverage_policy_v031f1.py
          tests/test_publication_gate_v031f2.py
      - name: Capture valuation baseline
        run: cp data/generated/full_market_coverage/full_market_coverage.json /tmp/axiom-valuation-before.json
      - name: Extend SEC business evidence checkpoint
        run: >-
          python scripts/build_sec_business_evidence.py
          --allow-live
          --write-cache
          --write
          --merge-existing
          --resume
          --priority-symbols config/frontier_priority_symbols.v1.json
          --limit 300
          --user-agent "$SEC_USER_AGENT"
      - name: Rebuild evidence-derived classifications and action gates
        run: |
          python scripts/build_company_signals.py
          python scripts/build_knowledge_inference.py
          python scripts/build_research_relevance_gate.py
          python scripts/build_research_eligibility.py
          python scripts/build_classification_quality_audit.py
          python scripts/build_coverage_policy.py
          python scripts/build_publication_catalog.py
          python scripts/build_company_overviews.py
      - name: Validate classification and publication contracts
        run: pytest -q tests/test_research_eligibility_v031c4.py tests/test_classification_quality_v031c5.py tests/test_coverage_policy_v031f1.py tests/test_publication_gate_v031f2.py
      - name: Commit derived research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/canonical_business_evidence data/generated/company_signals data/generated/knowledge_inference data/generated/research_relevance_gate data/generated/research_eligibility data/generated/classification_quality data/generated/coverage_policy data/generated/publication_gate data/generated/company_overview
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): refresh evidence-derived research classifications"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish daily refresh summary
        if: always()
        run: python scripts/write_daily_refresh_summary.py --before /tmp/axiom-valuation-before.json
