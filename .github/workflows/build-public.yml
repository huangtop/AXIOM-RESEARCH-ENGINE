name: Legacy Public Fixture Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .[dev]

      # Retained for explicit fixture compatibility only. Production market
      # population is scheduled by production-market-refresh.yml.
      - name: Refresh completed daily closes
        run: axiom refresh-closes

      - run: axiom validate
      - run: axiom build-public
      - run: pytest -q

      - name: Commit generated cache and public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache data/public
          if git diff --cached --quiet; then
            echo "No generated-data changes"
            exit 0
          fi
          git commit -m "chore(data): refresh daily close cache and public JSON"
          git pull --rebase origin main
          git push origin HEAD:main
