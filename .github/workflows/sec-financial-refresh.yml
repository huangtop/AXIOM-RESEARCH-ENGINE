name: SEC Financial Facts Refresh Executor

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the filing planner worklist is empty
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Daily SEC Filing Event Planner"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Capture valuation baseline
        run: cp data/generated/full_market_coverage/full_market_coverage.json /tmp/axiom-valuation-before.json
      - name: Require SEC identity
        run: test -n "$SEC_USER_AGENT"
      - name: Inspect filing refresh worklist
        id: gate
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/generated/sec_filing_refresh/refresh_plan.json")
          payload = json.loads(path.read_text()) if path.is_file() else {}
          count = int((payload.get("summary") or {}).get("refresh_company_count") or 0)
          financial_count = int((payload.get("summary") or {}).get("financial_refresh_company_count") or 0)
          force = os.environ.get("FORCE_REFRESH", "false").lower() == "true"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"refresh_count={count}\n")
              output.write(f"financial_count={financial_count}\n")
              output.write(f"should_refresh={'true' if force or count > 0 else 'false'}\n")
              output.write(f"force={'true' if force else 'false'}\n")
          print({"refresh_company_count": count, "force": force})
          PY
      - name: Download Company Facts and retain quarterly history
        if: steps.gate.outputs.force != 'true' && steps.gate.outputs.financial_count != '0'
        run: >-
          python scripts/build_sec_financial_population.py
          --download-bulk
          --bulk-zip data/onboarding/sec/companyfacts.zip
          --user-agent "$SEC_USER_AGENT"
          --refresh-plan data/generated/sec_filing_refresh/refresh_plan.json
          --merge-existing
          --write
      - name: Force full Company Facts rebuild
        if: steps.gate.outputs.force == 'true'
        run: >-
          python scripts/build_sec_financial_population.py
          --download-bulk
          --bulk-zip data/onboarding/sec/companyfacts.zip
          --user-agent "$SEC_USER_AGENT"
          --write
      - name: Rebuild per-company valuation and publication artifacts
        if: steps.gate.outputs.should_refresh == 'true'
        run: |
          python scripts/build_full_market_coverage.py
          python scripts/build_coverage_policy.py
          python scripts/build_publication_catalog.py
      - name: Validate financial history and valuation contracts
        if: steps.gate.outputs.should_refresh == 'true'
        run: >-
          pytest -q
          tests/test_sec_financial_population_v031v3.py
          tests/test_full_market_coverage_v031.py
          tests/test_coverage_policy_v031f1.py
          tests/test_publication_gate_v031f2.py
      - name: Mark refreshed filing accessions as processed
        if: steps.gate.outputs.force != 'true' && steps.gate.outputs.should_refresh == 'true'
        run: python scripts/mark_sec_accessions_processed.py
      - name: Commit refreshed financial and valuation artifacts
        if: steps.gate.outputs.should_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/canonical_financial_population data/generated/full_market_coverage data/generated/coverage_policy data/generated/publication_gate
          if [[ "${{ steps.gate.outputs.force }}" != "true" ]]; then
            git add data/generated/sec_filing_refresh/accession_ledger.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          python - <<'PY'
          import subprocess
          from pathlib import Path

          limit = 95 * 1024 * 1024
          staged = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=ACMR", "-z"]
          ).decode().split("\0")
          oversized = [(name, Path(name).stat().st_size) for name in staged if name and Path(name).is_file() and Path(name).stat().st_size > limit]
          if oversized:
              for name, size in oversized:
                  print(f"staged file exceeds 95 MiB guard: {name} ({size / 1024 / 1024:.2f} MiB)")
              raise SystemExit(1)
          PY
          git commit -m "chore(data): refresh SEC quarterly financial artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish daily refresh summary
        if: always()
        run: python scripts/write_daily_refresh_summary.py --before /tmp/axiom-valuation-before.json
