name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/generated/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: axiom validate
      - name: Run maintained automated test suites
        run: >-
          pytest -q
          "--ignore-glob=tests/test_company_*.py"
          --ignore=tests/test_classification_population_v031c5.py
          --ignore=tests/test_classification_quality_v031c5.py
          --ignore=tests/test_industry.py
          --ignore=tests/test_knowledge_inference_v031c3.py
          --ignore=tests/test_ontology.py
          --ignore=tests/test_research_eligibility_v031c4.py
          --ignore=tests/test_reviewed_classification_rules.py
          --ignore=tests/test_sec_business_evidence_v031_2b.py
          --ignore=tests/test_sec_company_evidence_v031_2a.py
          --ignore=tests/test_semantic_classifier.py
          --ignore=tests/test_theme_sector_inference_v031_1.py
          --ignore=tests/test_translation_universe_v2640.py
      - name: Lint changed Python files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF:-main}...HEAD" -- '*.py')
          if (( ${#files[@]} )); then
            ruff check "${files[@]}"
          fi
