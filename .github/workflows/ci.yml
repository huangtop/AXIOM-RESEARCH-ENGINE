name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/generated/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - name: Smoke-test workflow and publication contracts
        run: >-
          pytest -q
          tests/test_workflow_frequency_contracts.py
          tests/test_coverage_policy_v031f1.py
          tests/test_publication_gate_v031f2.py
          tests/test_full_market_coverage_v031.py::test_ai_research_companies_have_a_calculated_valuation_model
      - run: axiom validate
      - run: pytest -q
      - name: Lint changed Python files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${GITHUB_BASE_REF:-main}...HEAD" -- '*.py')
          if (( ${#files[@]} )); then
            ruff check "${files[@]}"
          fi
