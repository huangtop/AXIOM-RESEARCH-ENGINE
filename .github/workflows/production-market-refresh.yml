name: Production Daily Market Refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refetch an already populated completed session
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install market refresh dependencies
        run: pip install -e ".[dev,yahoo]"

      - name: Synchronize main before the expensive provider refresh
        run: git pull --ff-only origin main

      - name: Refresh all eligible operating-company closes
        run: >-
          python scripts/refresh_yahoo_daily_close.py
          --universe-root data/universe
          --delay 0.05
          --checkpoint-size 50
          --max-failure-rate 0.03
          --report data/generated/market/daily_close_refresh_report.json
          ${{ github.event_name == 'schedule' && '--force' || (inputs.force && '--force' || '') }}

      - name: Validate market cache contract
        run: pytest -q tests/test_cached_close.py

      - name: Commit market-only artifacts
        run: bash scripts/publish_daily_market_refresh.sh