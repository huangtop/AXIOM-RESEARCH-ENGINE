name: Production Daily Market Refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refetch an already populated completed session
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .[dev]

      - name: Synchronize main before the expensive provider refresh
        run: git pull --ff-only origin main

      - name: Capture valuation baseline
        run: cp data/generated/full_market_coverage/full_market_coverage.json /tmp/axiom-valuation-before.json

      - name: Refresh all eligible operating-company closes
        run: >-
          python scripts/refresh_yahoo_daily_close.py
          --universe-root data/universe
          --delay 0.05
          --checkpoint-size 50
          --max-failure-rate 0.03
          --report data/generated/market/daily_close_refresh_report.json
          ${{ github.event_name == 'schedule' && '--force' || (inputs.force && '--force' || '') }}

      - name: Rebuild valuation shards and publication catalog
        run: |
          python scripts/build_full_market_coverage.py
          python scripts/build_coverage_policy.py
          python scripts/build_publication_catalog.py

      - name: Validate focused production contracts
        run: pytest -q tests/test_full_market_daily_close_population_v031v1.py tests/test_full_market_coverage_v031.py tests/test_publication_gate_v031f2.py

      - name: Commit generated market artifacts
        run: bash scripts/publish_daily_market_refresh.sh

      - name: Publish daily refresh summary
        if: always()
        run: python scripts/write_daily_refresh_summary.py --before /tmp/axiom-valuation-before.json
