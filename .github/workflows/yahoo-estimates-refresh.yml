name: Daily Yahoo Estimates Refresh

on:
  workflow_dispatch:
    inputs:
      force:
        description: Refetch the selected daily batch regardless of the 30-day TTL
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and Yahoo provider dependencies
        run: pip install -e ".[dev,yahoo]"
      - name: Verify Yahoo provider is available before the batch
        run: python -c "import yfinance; print(yfinance.__version__)"
      - name: Capture valuation baseline
        run: cp data/generated/full_market_coverage/full_market_coverage.json /tmp/axiom-valuation-before.json
      - name: Build AI and technology prioritized daily estimate batch
        run: >-
          python scripts/build_daily_estimate_worklist.py
          --limit 200
          --output /tmp/axiom-daily-estimate-symbols.txt
      - name: Refresh the daily missing or 30-day-stale estimate batch
        run: >-
          python scripts/refresh_yahoo_company_snapshots.py
          --symbols-file /tmp/axiom-daily-estimate-symbols.txt
          --ttl-days 30
          --delay 0.5
          --max-fetch 200
          ${{ inputs.force && '--force' || '' }}
      - name: Rebuild estimate-driven valuation artifacts
        run: |
          python scripts/build_estimate_population_v031v6.py
          python scripts/build_multiple_policy_v031v6.py
          python scripts/build_full_market_coverage.py
          python scripts/build_coverage_policy.py
          python scripts/build_publication_catalog.py
      - name: Validate estimates and valuation publication contracts
        run: >-
          pytest -q
          tests/test_yahoo_company_snapshot.py
          tests/test_estimate_population_v031v6.py
          tests/test_multiple_policy_v031v6.py
          tests/test_full_market_coverage_v031.py
          tests/test_publication_gate_v031f2.py
      - name: Commit refreshed estimate and valuation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/generated/company/yahoo_company_snapshot.json \
            data/estimate_data/consensus_estimates.json \
            data/knowledge/valuation_assumptions.json \
            data/generated/full_market_coverage \
            data/generated/coverage_policy \
            data/generated/publication_gate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): refresh daily Yahoo estimate batch"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked changes remain after the estimates artifact commit:"
            git status --short
            exit 1
          fi
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish daily refresh summary
        if: always()
        run: python scripts/write_daily_refresh_summary.py --before /tmp/axiom-valuation-before.json
