name: Daily SEC Filing Event Planner

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Require SEC identity
        run: test -n "$SEC_USER_AGENT"
      - name: Download official submissions metadata and rebuild company evidence
        run: >-
          python scripts/build_sec_company_evidence.py
          --download-bulk
          --bulk-zip data/onboarding/sec/submissions.zip
          --user-agent "$SEC_USER_AGENT"
          --write
      - name: Derive filing event worklist
        run: >-
          python scripts/plan_sec_filing_refresh.py
          --submissions-bulk-zip data/onboarding/sec/submissions.zip
          --max-companies 200
      - run: pytest -q tests/test_sec_filing_refresh_v031c11.py
      - name: Commit metadata and event plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/canonical_company_evidence data/generated/sec_filing_refresh
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): plan SEC filing research events"
          git pull --rebase origin main
          git push origin HEAD:main
