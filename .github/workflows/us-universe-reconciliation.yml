name: Semiannual US Universe Reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 5 1,7 *"

permissions:
  contents: write

concurrency:
  group: production-data-writer
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Require SEC identity
        run: test -n "$SEC_USER_AGENT"
      - name: Fetch official listings and replace the canonical universe
        run: >-
          python scripts/build_us_universe_source.py
          --output data/generated/us_universe_reconciliation/source_snapshot.json
          --user-agent "$SEC_USER_AGENT"
          --reconcile
          --write
      - name: Validate canonical repository integrity
        run: axiom validate
      - name: Rebuild existing population and publication outputs
        run: |
          python scripts/discover_population_sources.py --write
          python scripts/build_production_population.py --write
          python scripts/validate_production_population.py
          python scripts/build_security_identity_normalization.py
          python scripts/build_etf_identity_bridge.py
          python scripts/build_research_relevance_gate.py
          python scripts/build_company_overviews.py
          python scripts/build_full_market_coverage.py
          python scripts/build_coverage_policy.py
          python scripts/build_publication_catalog.py
      - name: Commit reconciliation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/universe \
            data/generated/us_universe_reconciliation/source_snapshot.json \
            data/generated/population_manifest \
            data/generated/production_population \
            data/generated/security_identity \
            data/generated/etf_identity_bridge \
            data/generated/research_relevance_gate \
            data/generated/company_overview \
            data/generated/full_market_coverage \
            data/generated/coverage_policy \
            data/generated/publication_gate
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): reconcile official US universe"
          git pull --rebase origin main
          git push origin HEAD:main
